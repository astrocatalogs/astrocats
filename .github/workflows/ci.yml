name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.7"
      - name: Sync environment
        run: uv sync --frozen --all-extras
      - name: Run tests
        run: uv run pytest
