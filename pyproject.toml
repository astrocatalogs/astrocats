[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrocats"
dynamic = ["version"]
description = "Package for downloading, analyzing, and constructing open astronomy catalogs."
readme = "README.md"
license = "MIT"
requires-python = "==3.14.7"
authors = [
    { name = "James Guillochon & Luke Kelley", email = "guillochon@gmail.com" },
]
keywords = ["astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "astropy>=7.1",
    "beautifulsoup4>=4.13",
    "bokeh>=3.7",
    "GitPython>=3.1.45",
    "inflect>=7.5",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "palettable>=3.3",
    "psutil>=7.0",
    "requests>=2.32",
    "seaborn>=0.13",
    "tqdm>=4.67",
]

[project.optional-dependencies]
ads = ["ads>=0.12"]

[project.urls]
Homepage = "https://github.com/astrocatalogs/astrocats"
Repository = "https://github.com/astrocatalogs/astrocats"

[project.scripts]
astrocats = "astrocats.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
]

[tool.hatch.version]
path = "astrocats/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["astrocats"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/astrocats/supernovae",
    "/astrocats/tidaldisruptions",
    "/astrocats/novae",
    "/astrocats/faststars",
    "/astrocats/kilonovae",
    "/astrocats/blackholes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
required-version = ">=0.7"
